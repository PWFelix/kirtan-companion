<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<title>Play-through · Mrdanga Hero</title>
<style>
  :root {
    --head: #f1ebdd; --worn: #e6dccb; --ink: #2b241d; --muted: #6e6253;
    --clay: #b2582c; --umber: #6b4126;
    font: 14px/1.35 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    color: var(--ink); background: var(--head);
  }
  html, body { margin: 0; height: 100%; }
  body { display: flex; flex-direction: column; overflow: hidden; }
  header, footer {
    display: flex; align-items: center; gap: 16px; padding: 10px 18px;
    background: var(--worn); flex-wrap: wrap;
  }
  header h1 { margin: 0; font-size: 20px; }
  header .muted, footer .muted { color: var(--muted); }
  .grow { flex: 1; }
  button, select {
    font: inherit; color: var(--ink); background: var(--head);
    border: 1px solid #cdbfa8; border-radius: 10px; padding: 7px 12px; cursor: pointer;
  }
  button.primary { background: var(--clay); color: #fff; border-color: var(--clay); font-weight: 700; min-width: 96px; }
  label { display: flex; gap: 6px; align-items: center; color: var(--muted); }
  main { flex: 1; position: relative; min-height: 0; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  #seek { flex: 1; min-width: 200px; accent-color: var(--clay); }
  #stats { font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<header>
  <h1 id="song">…</h1><span id="artist" class="muted"></span>
  <span class="grow"></span>
  <span id="stats"></span>
</header>
<main><canvas id="cv"></canvas></main>
<footer>
  <button id="play" class="primary">▶ Play</button>
  <label>Hear
    <select id="source">
      <option value="mix">Full recording</option>
      <option value="backing">Play along (mridanga removed)</option>
      <option value="drums">Mridanga only</option>
    </select>
  </label>
  <label>Speed
    <select id="rate">
      <option value="0.5">50%</option><option value="0.75">75%</option>
      <option value="0.9">90%</option><option value="1" selected>100%</option>
    </select>
  </label>
  <label><input type="checkbox" id="chart"> chart sound</label>
  <button id="hands">Right-handed</button>
  <input id="seek" type="range" min="0" max="1000" value="0">
  <span id="time" class="muted"></span>
</footer>
<script type="module" src="/editor/preview.js"></script>
</body>
</html>
